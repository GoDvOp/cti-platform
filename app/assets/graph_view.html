<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Общий граф CTI</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#20314a;font:15px/1.5 system-ui,sans-serif}header{padding:16px 24px;background:white;border-bottom:1px solid #d3dde8}h1{font-size:24px;margin:0 0 5px}#status{font-size:13px;color:#586b81}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 24px;background:#f8fafd}input[type=search],select,button{border:1px solid #bbcbdc;border-radius:7px;background:white;color:#20314a;padding:8px;font:inherit}input[type=search]{width:230px}button{cursor:pointer}label{font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;height:calc(100vh - 180px);min-height:420px}canvas{width:100%;height:100%;touch-action:none;cursor:grab;background:#f7f9fc}aside{overflow:auto;padding:18px;background:white;border-left:1px solid #d3dde8}aside h2{font-size:18px;word-break:break-word}pre{white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,monospace;background:#f1f5fa;padding:12px;border-radius:7px}a{color:#165e9e}footer{padding:8px 24px;font-size:12px;color:#586b81}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}@media(max-width:850px){.layout{grid-template-columns:1fr;height:auto}canvas{height:65vh}aside{min-height:180px;max-height:40vh}.toolbar{padding:10px}.layout{min-height:0}}</style>
<header><h1>Общий граф CTI</h1><div id="status"></div></header>
<div class="toolbar"><select id="mode"><option value="all">Весь обзор</option><option value="threat">Компании и угрозы</option><option value="notice">Бюллетени и CVE</option><option value="bounty">Bug bounty</option></select><input id="search" type="search" placeholder="Найти компанию, ПО или CVE"><button id="fit">Уместить граф</button><label><input id="labels" type="checkbox"> Подписи стрелок</label><label><input id="refresh" type="checkbox" checked> Автообновление 60 с</label></div>
<div class="layout"><canvas id="graph" aria-label="Направленный граф компаний, ПО, источников и гипотез"></canvas><aside><h2 id="detail-title">Выбери узел или стрелку</h2><p id="detail-help">Колесо мыши меняет масштаб. Узлы можно перетаскивать, свободное поле — перемещать. Штриховые стрелки показывают исследовательский контекст.</p><div id="detail-links"></div><pre id="detail-properties" hidden></pre><div class="legend" id="legend"></div></aside></div>
<footer id="summary"></footer><script id="graph-data" type="application/json">__DATA__</script><script>__SCRIPT__</script></html>
