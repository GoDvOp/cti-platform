<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526b88"/></marker></defs><rect width="1000" height="340" fill="#f7f9fc"/><g fill="#fff" stroke="#b9c9da"><rect x="20" y="75" width="210" height="85" rx="10"/><rect x="290" y="75" width="190" height="85" rx="10"/><rect x="540" y="75" width="190" height="85" rx="10"/><rect x="790" y="75" width="190" height="85" rx="10"/></g><g font-family="sans-serif" font-size="16" fill="#20314a" text-anchor="middle"><text x="125" y="110">Росзарубежнефть</text><text x="125" y="140" font-size="13">использование по источнику</text><text x="385" y="110">TrueConf Server</text><text x="385" y="140" font-size="13">версия установки неизвестна</text><text x="635" y="110">Обновление / CVE</text><text x="635" y="140" font-size="13">публичный бюллетень</text><text x="885" y="110">Сообщение BI.ZONE</text><text x="885" y="140" font-size="13">попытки эксплуатации PHP</text></g><g stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"><path d="M230,115 H285"/><path d="M540,115 H485"/><path d="M790,115 H735"/></g><g font-family="sans-serif" font-size="15" fill="#75482c"><text x="25" y="215">Контраргумент: источник описывает закрытый контур без внешнего доступа.</text><text x="25" y="250">Вывод текущего среза: внутренняя проверка обновления; внешняя цель не установлена.</text><text x="25" y="295" fill="#60738a" font-size="13">Схема — иллюстрация сохранённых связей. Полные пути, даты, хеши и оговорки доступны в evidence.json.</text></g></svg>